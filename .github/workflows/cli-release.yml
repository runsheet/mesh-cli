name: CLI Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# a newer push to main supersedes a build still running: only the latest
# main is worth publishing, and five builds per merge queued on the mini's
# two org runners held the PR checks behind them for up to 36 minutes
concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: [self-hosted, mini]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: mesh-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: mesh-linux-arm64
          - goos: darwin
            goarch: amd64
            asset_name: mesh-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: mesh-darwin-arm64
          - goos: windows
            goarch: amd64
            asset_name: mesh-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X projectmesh.io/mesh-cli/internal/version.Version=v0.2.${{ github.run_number }}" -o dist/${{ matrix.asset_name }} ./cmd/mesh/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish release to projectmesh-io/mesh
    needs: build
    runs-on: [self-hosted, mini]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Create release on projectmesh-io/mesh
        uses: softprops/action-gh-release@v2
        with:
          repository: projectmesh-io/mesh
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v0.2.${{ github.run_number }}
          name: v0.2.${{ github.run_number }}
          body: |
            Automated release from `mesh-cli` main.

            Source commit: `${{ github.sha }}`

            Install: download the archive for your platform, extract, and put `mesh` on your `$PATH`.
          files: release/*
          fail_on_unmatched_files: true
          make_latest: true
