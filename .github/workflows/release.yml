# Spec 31 (OQ-2): release.yml stub so `gh workflow run release.yml` succeeds.
# The Shipper calls `gh workflow run release.yml --field version=<semver>`
# to trigger a mesh-cli release when shipping a work item.
#
# This delegates to the canonical cli-release.yml build pipeline.
# The version input is recorded in the release notes for traceability.

name: Release (Shipper Trigger)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver string for this release (e.g. v1.2.3)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    name: Trigger CLI Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build (all platforms)
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="v0.0.0-$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-8)"
          fi
          echo "Building version: $VERSION"
          for target in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
            GOOS="${target%%/*}"
            GOARCH="${target##*/}"
            OUT="dist/mesh-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then OUT="${OUT}.exe"; fi
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
              go build -trimpath \
              -ldflags="-s -w -X projectmesh.io/mesh-cli/internal/version.Version=${VERSION}" \
              -o "$OUT" ./cmd/mesh/
            echo "Built: $OUT"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh-release-${{ github.run_id }}
          path: dist/
          if-no-files-found: error

      - name: Summary
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "### Release triggered" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${VERSION:-auto}" >> $GITHUB_STEP_SUMMARY
          echo "SHA: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts uploaded (attach to a GitHub Release manually or extend this workflow)." >> $GITHUB_STEP_SUMMARY
