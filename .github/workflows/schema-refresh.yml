name: schema-refresh

# Daily: re-read the gateway's public schema into schema.json, regenerate
# fields_gen.go and open (or update) one pull request when anything changed
# (docs/adr/adr-010-generated-gateway-fields.md). PR checks never read the
# live gateway; this is the only place that does.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: [self-hosted, mini]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false   # the mini keeps Go's caches on disk

      - name: refresh schema.json from the gateway
        working-directory: internal/gateway
        run: go run ./internal/genfields -refresh

      - name: regenerate fields_gen.go
        run: go generate ./internal/gateway/...

      - name: open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: bot/schema-refresh
        run: |
          if [ -z "$(git status --porcelain -- internal/gateway)" ]; then
            echo "schema.json is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add internal/gateway
          git commit -m "chore(gateway): refresh schema.json and regenerate fields_gen.go"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Refresh the gateway schema and generated fields" \
              --body "The gateway's public schema changed: schema.json and fields_gen.go regenerated by the schema-refresh workflow."
          fi
