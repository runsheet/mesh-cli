name: schema-refresh

# Daily: re-read the gateway's public schema into schema.json, regenerate
# fields_gen.go and open (or update) one pull request when anything changed
# (docs/adr/adr-010-generated-gateway-fields.md). PR checks never read the
# live gateway; this is the only place that does. It also refreshes the
# node-mutations.json rule fixture from runsheet main (adr-026).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: refresh schema.json from the gateway
        working-directory: internal/gateway
        run: go run ./internal/genfields -refresh

      - name: regenerate fields_gen.go
        run: go generate ./internal/gateway/...

      - name: refresh node-mutations.json from runsheet
        working-directory: internal/gateway
        run: go run ./internal/genfields -refresh-rules

      - name: open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: bot/schema-refresh
        run: |
          if [ -z "$(git status --porcelain -- internal/gateway)" ]; then
            echo "schema.json and node-mutations.json are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add internal/gateway
          git commit -m "chore(gateway): refresh schema.json, regenerate fields_gen.go and refresh node-mutations.json"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Refresh the gateway schema, generated fields and node-mutations.json" \
              --body "The gateway's public schema changed: schema.json and fields_gen.go regenerated, and gatewaytest/testdata/node-mutations.json (runsheet's per-bearer rules for registerNode, heartbeatNode and claimWorkItem) refreshed, by the schema-refresh workflow. A change to node-mutations.json is a change to a node mutation's rule: check the node's inputs against it."
          fi
