# Tag-triggered release: the one nodes update themselves from.
#
# A tag v* builds the node for linux/amd64, linux/arm64 and darwin/arm64,
# writes SHA256SUMS over them, signs it keyless with Sigstore (this
# workflow's GitHub OIDC identity) and publishes all five files as a
# GitHub release on runsheet/mesh-cli. The asset names and the
# signing identity are the contract `mesh node update` verifies
# (docs/adr/adr-002-signed-tag-releases.md):
#
#   identity: https://github.com/runsheet/mesh-cli/.github/workflows/release-tag.yml@refs/tags/<tag>
#   issuer:   https://token.actions.githubusercontent.com
#
# The same tag builds the node image (mesh-specs ADR 007) from
# images/node/Containerfile for linux/amd64 and linux/arm64, pushes it as
# ghcr.io/runsheet/mesh-node:<tag> and signs its digest keyless with
# the same identity. The release is published only after the image is
# pushed, so a node that can fetch a release can pull its image; the five
# release assets and their signature are unchanged.
#
# There is no other release channel on runsheet/mesh-cli: cli-release.yml
# (main builds) was dropped when the repo moved to the runsheet org
# (adr-002). The same release is also published, identical, on the
# public mirror runsheet/mesh (adr-002's amendment "the public mirror on
# runsheet/mesh"): scripts/mirror-release.sh creates it there — same
# tag, title, notes and five assets — then checks it byte-for-byte the
# one just signed, and publishes dist/mirror/'s README and Rigger
# binding. The workflow's own GITHUB_TOKEN cannot write another repo, so
# the mirror step first exchanges this run's OIDC identity (audience
# runsheet-rigger) at the runsheet gateway for a token on runsheet/mesh
# alone, contents: write, at most an hour
# (scripts/exchange-workflow-token.sh,
# docs/adr/adr-015-workflow-tokens-exchanged-through-rigger.md), against
# the binding runsheet/mesh carries, .runsheet/bindings/mesh-cli-release.yaml.
# Until the runsheet half answers, a failed exchange falls back to the
# RELEASE_TOKEN secret, and the log says which path it took. A failing
# mirror step fails the workflow — there is no partial publish.
#
# The publish job is idempotent (adr-002's amendment "the publish job
# is idempotent"): both the runsheet/mesh-cli release and the mirror
# are created through scripts/ensure-release.sh, never a bare `gh
# release create`, so a re-run after a mirror failure keeps an existing
# identical release rather than failing with "release exists" — the
# fix, before this, was deleting the release by hand (run
# 36499785802, 2026-09-29). A release that exists but differs fails
# loudly; nothing is ever deleted.

name: Release (tag)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: [self-hosted, mini]
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: mesh-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: mesh-linux-arm64
          - goos: darwin
            goarch: arm64
            asset_name: mesh-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false   # the mini keeps Go's caches on disk; packing them for GitHub's cache ran zstd 40+ min per job (2026-09-26)

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          ASSET: ${{ matrix.asset_name }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X projectmesh.io/mesh-cli/internal/version.Version=${GITHUB_REF_NAME} -X projectmesh.io/mesh-cli/internal/version.Sha=${GITHUB_SHA::7}" \
            -o "dist/${ASSET}" ./cmd/mesh/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  image:
    name: Node image ${{ github.ref_name }}
    runs-on: [self-hosted, mini]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Go version from go.mod
        id: go
        run: echo "version=$(awk '$1 == "go" { print $2 }' go.mod)" >> "$GITHUB_OUTPUT"

      # The mini's runners share one $HOME, so a job that logs in to
      # ghcr.io in ~/.docker/config.json is logged out by any other job's
      # post-step `docker logout ghcr.io`: v0.0.0-runsheet-test.3's
      # logout at 13:53:49 left .4 (run 36245651812) signing at 13:55:18
      # with no credentials — UNAUTHORIZED. Each job logs in to a config
      # of its own under $RUNNER_TEMP, with the buildx plugin linked in.
      - name: A docker config of this job's own
        run: |
          mkdir -p "${RUNNER_TEMP}/docker/cli-plugins"
          for p in "${HOME}"/.docker/cli-plugins/*; do
            if [ -e "$p" ]; then ln -sf "$p" "${RUNNER_TEMP}/docker/cli-plugins/"; fi
          done
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ghcr.io/runsheet/mesh-node:${{ github.ref_name }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: images/node
          file: images/node/Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            GO_VERSION=${{ steps.go.outputs.version }}
            MESH_VERSION=${{ github.ref_name }}
          tags: ghcr.io/runsheet/mesh-node:${{ github.ref_name }}
          push: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/runsheet/mesh-node@${DIGEST}"

      - name: Verify the image's signature against the release identity
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "ghcr.io/runsheet/mesh-node@${DIGEST}" \
            --certificate-identity "https://github.com/runsheet/mesh-cli/.github/workflows/release-tag.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  publish:
    name: Sign and publish ${{ github.ref_name }}
    needs: [build, image]
    runs-on: [self-hosted, mini]
    permissions:
      contents: write
      id-token: write

    steps:
      # scripts/mirror-release.sh and dist/mirror/README.md live in the
      # repo tree, which this job otherwise never checks out. Runs first:
      # it wipes the workspace, and Download artifacts below has not yet
      # created release/. Full history (not just the tag's commit) so
      # release-notes.sh can walk <previous-tag>..<tag>.
      - name: Checkout code (full history, for the release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          # Only the binaries: build-push-action also uploads the image's
          # build record (<repo>~<id>.dockerbuild), which this action
          # cannot download (v0.0.0-runsheet-test.2, run 36244616825).
          pattern: mesh-*
          path: release
          merge-multiple: true

      - name: Check the three assets
        working-directory: release
        run: |
          for f in mesh-linux-amd64 mesh-linux-arm64 mesh-darwin-arm64; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prev="$(
            { printf '%s\n' "$TAG"; git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'; } \
              | sort -V -u \
              | awk -v t="$TAG" '$0==t{print prev; exit} {prev=$0}'
          )"
          prev="${prev:-v0.0.0-runsheet-test.6}"
          scripts/release-notes.sh "$prev" "$TAG" > release/NOTES.md
          cat release/NOTES.md

      - name: Generate SHA256SUMS
        working-directory: release
        run: sha256sum mesh-* > SHA256SUMS && cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS (keyless)
        working-directory: release
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Verify the signature against the release identity
        working-directory: release
        run: |
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-tag.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Compute the release notes
        # One $NOTES, used by both creates below: the grouped notes
        # release-notes.sh wrote to release/NOTES.md above, so the
        # mirror on runsheet/mesh shows the exact same text.
        run: |
          {
            echo "NOTES<<NOTES_EOF"
            cat release/NOTES.md
            echo "NOTES_EOF"
          } >>"$GITHUB_ENV"

      - name: Create release on runsheet/mesh-cli
        # scripts/ensure-release.sh, not a bare `gh release create`: a
        # release of $TAG that already exists here (a re-run after the
        # mirror step below failed) is kept when its assets are
        # identical, never recreated or deleted (adr-002's amendment
        # "the publish job is idempotent").
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: scripts/ensure-release.sh "$TAG" "$GITHUB_SHA" release

      - name: Mirror the release to runsheet/mesh
        # scripts/mirror-release.sh creates the identical release on the
        # public mirror via ensure-release.sh (same tag, title, notes
        # and five assets, a prerelease only when the tag has a "-",
        # idempotent — an existing identical mirror release is kept,
        # never recreated or deleted), then checks it byte-for-byte the
        # one just signed and its bundle against the runsheet/mesh-cli
        # identity, and publishes dist/mirror/README.md and the binding
        # .runsheet/bindings/mesh-cli-release.yaml when their content
        # differs (adr-002's amendments "the public mirror on
        # runsheet/mesh" and "the publish job is idempotent"). Its
        # GH_TOKEN is exchanged first from this run's OIDC identity
        # through Rigger (adr-015, the job's id-token: write): one
        # repository, contents: write, an hour. RELEASE_TOKEN is the
        # transitional fallback while the runsheet half is not there;
        # the log says which path was taken. With neither the step
        # fails. A failing mirror fails the workflow.
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: runsheet/mesh
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          err="${RUNNER_TEMP}/exchange-workflow-token.err"
          if token=$(scripts/exchange-workflow-token.sh runsheet/mesh mesh-cli-release 2>"$err"); then
            echo "::add-mask::${token}"
            export GH_TOKEN="$token"
            echo "mirror token: exchanged through rigger, expires $(tail -n1 "$err")"
          else
            reason=$(tr '\n' ' ' <"$err" | sed 's/^exchange-workflow-token: //; s/ *$//')
            if [ -n "${RELEASE_TOKEN}" ]; then
              export GH_TOKEN="$RELEASE_TOKEN"
              echo "mirror token: RELEASE_TOKEN fallback (exchange failed: ${reason})"
            else
              echo "mirror token: none — the exchange through rigger failed (${reason}) and RELEASE_TOKEN is not set" >&2
              exit 1
            fi
          fi
          unset RELEASE_TOKEN
          scripts/mirror-release.sh "$TAG" "$SHA" release
