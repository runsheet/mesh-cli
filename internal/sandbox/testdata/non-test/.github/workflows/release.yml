name: Release
on:
  push:
    tags: ["v*"]
jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/migrate.sh
  publish:
    runs-on: ubuntu-latest
    steps:
      - run: goreleaser release
