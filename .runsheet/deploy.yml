# mesh-cli ships through runsheet (ADR 002 amendment 2026-11-15): a
# node-changing merge to main raises this deploy, a runsheet deploy job of
# runsheet/mesh-cli. Before the first step the session calls runsheet's
# release_begin, which names the version (the next patch after the
# newest release in runsheet's store) and hands back an upload token for
# that version alone; it exports them as RELEASE_VERSION and
# RELEASE_UPLOAD_TOKEN. After the build step it calls the node tool
# sign_release on dist/SHA256SUMS: the node signs it through our own
# Sigstore as this job (the session never holds a signing token). No
# credential lives in this file or the repository.
environment:
  name: releases
  platform: releases

env:
  RELEASE_STORE: https://api.runsheet.dev/releases/mesh

steps:
  - name: build
    command: go run ./cmd/mesh release build --version "$RELEASE_VERSION" --sha "$COMMIT_SHA" --out dist
    timeout: 20m
  - name: signed
    command: test -s dist/SHA256SUMS.sigstore.json
    timeout: 1m
  - name: upload
    command: >-
      for f in dist/SHA256SUMS dist/SHA256SUMS.sigstore.json dist/mesh-version dist/mesh-linux-amd64 dist/mesh-linux-arm64 dist/mesh-darwin-arm64;
      do curl -fsS -X PUT -H "Authorization: Bearer $RELEASE_UPLOAD_TOKEN" --data-binary "@$f" "$RELEASE_STORE/$RELEASE_VERSION/$(basename "$f")" || exit 1; done
    timeout: 10m

probe:
  command: curl -fsS "$RELEASE_STORE/$RELEASE_VERSION/mesh-version"
  body: v
  retries: 3
  interval: 10s

policy:
  on_failure: hold
