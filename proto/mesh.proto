syntax = "proto3";

package mesh.v1;

option go_package = "projectmesh.io/mesh-cli/proto/meshv1;meshv1";

import "google/protobuf/timestamp.proto";

// NodeService is the contract between a mesh node daemon (client) and mesh-api
// (server). All transport is node-initiated outbound to survive NAT. Register
// and Heartbeat are unary RPCs. NodeStream is the long-lived bidi channel over
// which api pushes commands to the node and node streams responses plus
// terminal bytes back.
service NodeService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc NodeStream(stream NodeToApi) returns (stream ApiToNode);
}

// ---------------------------------------------------------------------------
// Register / Heartbeat
// ---------------------------------------------------------------------------

message RegisterRequest {
  string node_slug = 1;
  string version = 2;
  NodeCapabilities capabilities = 3;
  map<string, string> metadata = 4;

  reserved 5 to 15;
}

message RegisterResponse {
  string node_id = 1;
  google.protobuf.Timestamp registered_at = 2;
  int32 heartbeat_interval_seconds = 3;

  reserved 4 to 15;
}

message HeartbeatRequest {
  string node_id = 1;
  NodeStatus status = 2;
  repeated SessionSummary sessions = 3;

  reserved 4 to 15;
}

message HeartbeatResponse {
  google.protobuf.Timestamp server_time = 1;
  int32 next_interval_seconds = 2;

  reserved 3 to 15;
}

message NodeCapabilities {
  string os = 1;
  string arch = 2;
  int32 max_sessions = 3;
  repeated string supported_models = 4;

  reserved 5 to 15;
}

enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_ONLINE = 1;
  NODE_STATUS_DEGRADED = 2;
  NODE_STATUS_DRAINING = 3;
}

// ---------------------------------------------------------------------------
// NodeStream envelope
// ---------------------------------------------------------------------------

// ApiToNode frames are commands or pushes originated by mesh-api. request_id
// correlates with NodeToApi.response.request_id for request/response pairs.
// Server-push frames (agent_sync, task_poke) use request_id as a simple
// dedupe/ack handle.
message ApiToNode {
  string request_id = 1;

  oneof payload {
    SessionListRequest session_list = 10;
    SessionStartRequest session_start = 11;
    SessionStopRequest session_stop = 12;
    SessionNewUpRequest session_new_up = 13;
    SessionAttachOpen session_attach_open = 14;
    SessionAttachInput session_attach_input = 15;
    SessionAttachClose session_attach_close = 16;
    AgentSync agent_sync = 20;
    TaskPoke task_poke = 21;
    ChannelInbound channel_inbound = 22;
    StreamHello hello = 30;
  }

  reserved 2 to 9, 17 to 19, 23 to 29, 31 to 49;
}

// NodeToApi frames are responses to api requests plus unsolicited stream
// events (session-attach data, session lifecycle changes observed on the node).
message NodeToApi {
  string request_id = 1;

  oneof payload {
    SessionListResponse session_list_response = 10;
    SessionStartResponse session_start_response = 11;
    SessionStopResponse session_stop_response = 12;
    SessionNewUpResponse session_new_up_response = 13;
    SessionAttachData session_attach_data = 14;
    SessionAttachClosed session_attach_closed = 15;
    AgentSyncAck agent_sync_ack = 20;
    TaskPokeAck task_poke_ack = 21;
    ChannelInboundAck channel_inbound_ack = 22;
    SessionEvent session_event = 30;
    StreamError error = 40;
    StreamHelloAck hello_ack = 50;
  }

  reserved 2 to 9, 16 to 19, 23 to 29, 31 to 39, 41 to 49;
}

message StreamHello {
  string node_id = 1;
  string node_token_fingerprint = 2;
}

message StreamHelloAck {
  google.protobuf.Timestamp accepted_at = 1;
}

message StreamError {
  string code = 1;
  string message = 2;
}

// ---------------------------------------------------------------------------
// Session lifecycle
// ---------------------------------------------------------------------------

message SessionListRequest {}

message SessionListResponse {
  repeated SessionSummary sessions = 1;
}

// SessionStart asks the node to spawn a fresh PTY for agent_id. If a session
// already exists, the node returns the existing summary unchanged.
message SessionStartRequest {
  string agent_id = 1;
  SessionSpawnOptions options = 2;
}

message SessionStartResponse {
  SessionSummary session = 1;
  bool created = 2;
}

message SessionStopRequest {
  string agent_id = 1;
  bool force = 2;
}

message SessionStopResponse {
  bool stopped = 1;
}

// SessionNewUp kills the current session for agent_id and starts a fresh one
// without passing --resume, dropping the prior Claude Code conversation state.
message SessionNewUpRequest {
  string agent_id = 1;
  SessionSpawnOptions options = 2;
}

message SessionNewUpResponse {
  SessionSummary session = 1;
}

message SessionSpawnOptions {
  string system_prompt = 1;
  repeated string tools = 2;
  string model = 3;
  map<string, string> env = 4;

  reserved 5 to 15;
}

message SessionSummary {
  string agent_id = 1;
  string claude_session_id = 2;
  int32 pid = 3;
  SessionState state = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp last_activity_at = 6;
  uint32 cols = 7;
  uint32 rows = 8;

  reserved 9 to 15;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_STARTING = 1;
  SESSION_STATE_RUNNING = 2;
  SESSION_STATE_EXITED = 3;
  SESSION_STATE_CRASHED = 4;
}

// SessionEvent is an unsolicited lifecycle notification from node to api (e.g.
// PTY exit, crash-and-restart). Used to keep mesh-api's view consistent
// between heartbeats.
message SessionEvent {
  string agent_id = 1;
  SessionState state = 2;
  int32 exit_code = 3;
  string detail = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

// ---------------------------------------------------------------------------
// Session attach (bidi over NodeStream)
// ---------------------------------------------------------------------------

// SessionAttachOpen opens a logical attach channel multiplexed over the node
// stream. attach_id is chosen by mesh-api and scopes all subsequent input /
// data / close frames for this viewer.
message SessionAttachOpen {
  string attach_id = 1;
  string agent_id = 2;
  bool read_only = 3;
  uint32 replay_bytes = 4;
}

message SessionAttachInput {
  string attach_id = 1;
  bytes data = 2;
}

message SessionAttachClose {
  string attach_id = 1;
}

// SessionAttachData is a node→api terminal-bytes frame. dropped_bytes is
// non-zero when the node's 4 MB per-session buffer overflowed and older bytes
// were dropped (per decision A.3).
message SessionAttachData {
  string attach_id = 1;
  bytes data = 2;
  uint64 dropped_bytes = 3;
  google.protobuf.Timestamp observed_at = 4;
}

message SessionAttachClosed {
  string attach_id = 1;
  string reason = 2;
}

// ---------------------------------------------------------------------------
// Agent sync (server push)
// ---------------------------------------------------------------------------

// AgentSync pushes the authoritative set of agents pinned to this node. The
// node diffs against its local registry and starts / stops sessions to match.
message AgentSync {
  repeated AgentDefinition agents = 1;
  AgentSyncMode mode = 2;
  string revision = 3;
}

enum AgentSyncMode {
  AGENT_SYNC_MODE_UNSPECIFIED = 0;
  AGENT_SYNC_MODE_FULL = 1;
  AGENT_SYNC_MODE_DELTA = 2;
}

message AgentDefinition {
  string agent_id = 1;
  string name = 2;
  string description = 3;
  string system_prompt = 4;
  repeated string tools = 5;
  string model = 6;
  string owner_id = 7;
  string project_id = 8;
  map<string, string> metadata = 9;
  google.protobuf.Timestamp updated_at = 10;
  AgentLifecycle lifecycle = 11;

  reserved 12 to 20;
}

enum AgentLifecycle {
  AGENT_LIFECYCLE_UNSPECIFIED = 0;
  AGENT_LIFECYCLE_ACTIVE = 1;
  AGENT_LIFECYCLE_PAUSED = 2;
  AGENT_LIFECYCLE_DELETED = 3;
}

message AgentSyncAck {
  string revision = 1;
  repeated string applied_agent_ids = 2;
  repeated AgentSyncFailure failures = 3;
}

message AgentSyncFailure {
  string agent_id = 1;
  string reason = 2;
}

// ---------------------------------------------------------------------------
// Task poke (server push, latency optimization)
// ---------------------------------------------------------------------------

// TaskPoke nudges a specific agent's session to check its queue now rather
// than waiting for the next scheduled tick. Lost pokes are tolerable.
message TaskPoke {
  string agent_id = 1;
  string task_id = 2;
  TaskPokeReason reason = 3;
  google.protobuf.Timestamp issued_at = 4;
}

enum TaskPokeReason {
  TASK_POKE_REASON_UNSPECIFIED = 0;
  TASK_POKE_REASON_ASSIGNED = 1;
  TASK_POKE_REASON_HANDOFF = 2;
  TASK_POKE_REASON_REVIEW_REQUESTED = 3;
  TASK_POKE_REASON_UPDATED = 4;
}

message TaskPokeAck {
  string task_id = 1;
  bool delivered = 2;
  string detail = 3;
}

// ChannelInbound delivers one inbound channel message (Discord, WhatsApp, web,
// mobile) to the node that pins the conversation's agent. mesh-api resolves the
// binding ((platform, external_id) → conversation/agent/node) BEFORE sending, so
// the node routes by agent_id to that agent's mesh-shim router socket, which
// surfaces it to the live claude session as a notifications/claude/channel push.
// Correlated (request_id) — mesh-api awaits ChannelInboundAck, so a lost user
// message is observable (unlike a best-effort TaskPoke).
message ChannelInbound {
  string conversation_id = 1;
  string agent_id = 2;
  string platform = 3;              // whatsapp | discord | web
  string external_id = 4;           // the binding key: group/DM JID or channel id
  string content = 5;               // message text
  string sender = 6;                // display name / handle (optional)
  string sender_id = 7;             // stable upstream sender id (optional)
  string message_id = 8;            // upstream message id (optional; idempotency)
  string claude_session_id = 9;     // conversation's claude session to resume (empty until first spawn)
  string conversation_status = 10;  // active | hibernated | cleared — whether the node must resume the PTY first
  google.protobuf.Timestamp sent_at = 11;
}

// ChannelInboundAck reports whether the node accepted the inbound message for
// delivery. accepted=false + detail lets mesh-api distinguish transient (agent
// resuming) from terminal (agent_not_pinned_here).
message ChannelInboundAck {
  bool accepted = 1;
  string detail = 2;
}
